<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title></title>
    <style>
      textarea,
      input {
        display: block;
        width: 100%;
      }
    </style>
  </head>

  <body>
    <textarea></textarea>
    <textarea id="defaultEncoded"></textarea>
    <textarea id="encoded"></textarea>
    <textarea id="decoded"></textarea>
    <script>
      function asciify(input) {
        if (input == null) return ''

        return (
          String(input)
            // Normalize variants
            .normalize('NFKC')

            // Quotes/apostrophes
            .replace(/[\u2018\u2019\u201A]/g, "'") // ` ' #
            .replace(/[\u201B]/g, "'") // # (sometimes)
            .replace(/[\u201C\u201D\u201E]/g, '"') // " " #
            .replace(/[\u00AB]/g, '"') //
            .replace(/[\u00BB]/g, '"') //

            // Dashes/hyphens
            .replace(/[\u2013\u2014]/g, '-') // - -
            .replace(/[\u2212]/g, '-') // -

            // Ellipsis
            .replace(/\u2026/g, '...') // #

            // Misc punctuation
            .replace(/\u00A0/g, ' ') // non-breaking space -> space
            .replace(/\u202F/g, ' ') // narrow no-break space -> space
            .replace(/\u00B7/g, '*') //  -> *
            .replace(/\u2022/g, '-') // # -> -
            .replace(/\u00D7/g, 'x') //  -> x
            .replace(/\u00F7/g, '/') //  -> /

            // Remove remaining non-ASCII characters (optional)
            .replace(/[^\x00-\x7F]/g, ch => (ch === '\u0000' ? '' : ch))
        )
      }

      function encode(text) {
        text = asciify(text)

        // Spaces between words
        text = text.replace(/([a-z]) ([a-z])(?=[a-z])/g, (match, before, char) => {
          return before + char.toUpperCase()
        })

        // Spaces between sentences
        text = text.replace(/\. (?=[A-Z])/g, ".")

        // Commas
        text = text.replace(/\, (?=[a-z])/g, ".")

        // Convert double quotes
        text = text.replace(/\"/g, "'")

        text = encodeURIComponent(text)
        text = text.replace(/%20/g, '+')

        return text
      }

      function decode(text) {
        text = text.replaceAll('+', ' ')
        text = decodeURIComponent(text)

        text = text.replace(/([a-z])([A-Z])/g, (match, lower, upper) => {
          return lower + ' ' + upper.toLowerCase()
        })

        text = text.replace(/\.(?=[A-Z])/g, '. ')
        text = text.replace(/\.(?=[a-z])/g, ', ')

        return text
      }

      document.querySelector('textarea').addEventListener('input', e => {
        defaultEncoded.value = encodeURIComponent(e.target.value)
        encoded.value = encode(e.target.value)
        decoded.value = decode(encoded.value)
      })
    </script>
  </body>
</html>
